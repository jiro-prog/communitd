name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 開発は Windows・CI は ubuntu だと、パスの意味論の違いが公開してから出る
    # (最初の CI で 9 件 fail した 2026-09-11)。両方を回して、どちらかでしか
    # 通らないコードを入れたその場で気づけるようにする
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
